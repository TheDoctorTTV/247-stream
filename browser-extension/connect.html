<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stream247 YouTube Connect</title><link rel="stylesheet" href="connect.css"></head>
<body>
  <h1>Stream247 <span>YouTube Connect</span></h1>
  <form id="pairForm">
    <label for="server">Server address</label>
    <input id="server" type="url" placeholder="https://stream247.example.com" required autocomplete="off">
    <label for="code">Pairing code</label>
    <input id="code" type="text" placeholder="From Settings → Connect browser" required autocomplete="off" spellcheck="false">
    <label for="device">Browser name</label>
    <input id="device" type="text" value="My browser" maxlength="64" autocomplete="off">
    <label class="check"><input id="pairAuto" type="checkbox">Enable automatic sync</label>
    <p class="hint">Connect only to a server you trust. YouTube cookies grant account access.</p>
    <button type="submit">Pair and sync</button>
  </form>
  <section id="connected" hidden>
    <p id="destination"></p>
    <label class="check"><input id="autoSync" type="checkbox">Automatic sync</label>
    <p id="lastSync" class="hint"></p>
    <div class="actions"><button id="sync" type="button">Sync now</button><button id="disconnect" class="secondary" type="button">Disconnect</button></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="hint">Cookies may help with restricted or private videos. Playback is not guaranteed.</p>
  <script src="connect.js"></script>
</body>
</html>
